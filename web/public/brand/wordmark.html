<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  html,body{margin:0;width:1600px;height:500px;background:transparent;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center;font-family:Georgia,'Times New Roman',serif}
  .row{display:flex;align-items:center;gap:44px}
  .mark{position:relative;width:150px;height:150px;display:grid;place-items:center}
  .diamond{position:absolute;inset:0;transform:rotate(45deg);border-radius:34px;background:linear-gradient(135deg,#FF4D8D,#C44DFF 52%,#E9C46A);box-shadow:0 18px 50px rgba(255,77,141,.28)}
  .letter{position:relative;z-index:2;color:#fff;font-size:82px;line-height:1;transform:translateY(-2px)}
  .word{color:#F5F1EA;font-size:150px;line-height:1;letter-spacing:.22em;font-weight:400}
  .dot{color:#FF4D8D}
</style>
</head>
<body>
  <div class="row">
    <div class="mark"><div class="diamond"></div><div class="letter">A</div></div>
    <div class="word">AMY<span class="dot">.</span></div>
  </div>
</body>
</html>
